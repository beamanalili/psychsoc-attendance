<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Scanner</title>

  <!-- Tailwind CDN (for clean UI) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center min-h-screen">

  <!-- HEADER -->
  <div class="w-full max-w-md mt-6 text-center">
    <h1 class="text-2xl font-bold">📍 Attendance Scanner</h1>
    <p class="text-gray-400 text-sm">Scan member QR code to mark attendance</p>
  </div>

  <!-- STATUS CARD -->
  <div class="w-full max-w-md mt-4 bg-gray-800 p-4 rounded-xl shadow">
    <p class="text-sm text-gray-400">Event Status</p>
    <p class="text-green-400 font-bold">🟢 ACTIVE</p>
  </div>

  <!-- SCANNER BOX -->
  <div class="w-full max-w-md mt-6 bg-white p-4 rounded-xl shadow">
    <div id="reader" class="w-full"></div>
  </div>

  <!-- RESULT BOX -->
  <div class="w-full max-w-md mt-4 bg-gray-800 p-4 rounded-xl">
    <p class="text-sm text-gray-400">Last Scan</p>
    <p id="result" class="text-lg font-semibold">Waiting for scan...</p>
  </div>

  <!-- ATTENDANCE COUNTER -->
  <div class="w-full max-w-md mt-4 bg-gray-800 p-4 rounded-xl text-center">
    <p class="text-gray-400 text-sm">Attendance Count</p>
    <p class="text-2xl font-bold" id="count">0</p>
  </div>

  <script>
    let count = 0;

    function onScanSuccess(decodedText) {
      document.getElementById("result").innerText = "✔ " + decodedText;

      count++;
      document.getElementById("count").innerText = count;

      // Simple anti-spam delay (prevents rapid duplicate scans)
      setTimeout(() => {}, 2000);
    }

    function onScanError(errorMessage) {
      // ignore scan errors (normal)
    }

    let html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        html5QrCode.start(
          devices[0].id,
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          onScanError
        );
      }
    });
  </script>

</body>
</html>
