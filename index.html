<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBTEYT5qUaVjMP3ZamaX7pRov51Dix_74w",
  authDomain: "psychsoc-attendance-system.firebaseapp.com",
  projectId: "psychsoc-attendance-system",
  storageBucket: "psychsoc-attendance-system.firebasestorage.app",
  messagingSenderId: "93131590758",
  appId: "1:93131590758:web:bfea89644381b1972af1a7",
  measurementId: "G-C5SH1EEQP2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ================= DOM ================= */
const loginPage = document.getElementById("loginPage");
const app = document.getElementById("app");
const adminPanel = document.getElementById("adminPanel");

const eventName = document.getElementById("eventName");
const activeEventText = document.getElementById("activeEventText");

const result = document.getElementById("result");
const countEl = document.getElementById("count");

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginError = document.getElementById("loginError");

/* ================= STATE ================= */
let html5QrCode = null;
let userRole = null;
let activeEvent = null;
let count = 0;

/* ================= LOGIN ================= */
function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(err => loginError.innerText = err.message);
}

/* ================= LOGOUT ================= */
function logout() {
  try {
    if (html5QrCode) {
      html5QrCode.stop().catch(() => {});
      html5QrCode.clear();
      html5QrCode = null;
    }
  } catch (e) {}

  result.innerText = "Waiting...";
  count = 0;
  countEl.innerText = "0";
  activeEvent = null;

  auth.signOut();
}

/* ================= ROLE ================= */
async function loadUserRole(user) {
  const doc = await db.collection("users").doc(user.uid).get();

  if (doc.exists) {
    userRole = doc.data().role;
  }

  adminPanel.classList.toggle("hidden", userRole !== "admin");
}

/* ================= EVENTS ================= */

async function loadEvents() {
  const snap = await db.collection("events")
    .orderBy("createdAt", "desc")
    .get();

  const list = document.getElementById("eventList");
  if (!list) return;

  list.innerHTML = "";

  snap.forEach(doc => {
    const data = doc.data();

    const btn = document.createElement("button");
    btn.innerText = (data.active ? "🟢 " : "⚪ ") + data.name;

    btn.className = "w-full p-2 border rounded mb-2";

    btn.onclick = () => setActiveEvent(doc.id);

    list.appendChild(btn);
  });
}

async function loadActiveEvent() {
  const snap = await db.collection("events")
    .where("active", "==", true)
    .limit(1)
    .get();

  if (snap.empty) {
    activeEvent = null;
    if (activeEventText) activeEventText.innerText = "No active event";
    return;
  }

  const doc = snap.docs[0];

  activeEvent = doc.id;

  if (activeEventText) {
    activeEventText.innerText = "Active: " + doc.data().name;
  }

  listenToAttendance();
}

async function createNewEvent() {

  if (userRole !== "admin") return;

  if (!eventName.value.trim()) {
    alert("Enter event name");
    return;
  }

  await db.collection("events").add({
    name: eventName.value,
    active: false,
    createdBy: auth.currentUser.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  eventName.value = "";
  await loadEvents();
}

async function setActiveEvent(eventId) {

  const all = await db.collection("events").get();

  const batch = db.batch();

  all.forEach(doc => {
    batch.update(doc.ref, { active: false });
  });

  await batch.commit();

  await db.collection("events").doc(eventId).update({
    active: true
  });

  await loadActiveEvent();
  await loadEvents();
}

async function endEvent() {

  if (userRole !== "admin") return;

  const snap = await db.collection("events")
    .where("active", "==", true)
    .get();

  snap.forEach(doc => {
    db.collection("events").doc(doc.id).update({ active: false });
  });

  activeEvent = null;

  if (activeEventText) {
    activeEventText.innerText = "No active event";
  }
}

/* ================= LIVE DASHBOARD ================= */

function listenToAttendance() {

  if (!activeEvent) return;

  db.collection("attendance")
    .doc(activeEvent)
    .collection("records")
    .orderBy("timestamp", "desc")
    .onSnapshot(snapshot => {

      const list = document.getElementById("attendanceList");
      if (!list) return;

      list.innerHTML = "";

      snapshot.forEach(doc => {
        const d = doc.data();

        const row = document.createElement("div");
        row.className = "p-2 border rounded text-sm";

        row.innerHTML = `
          <div class="font-semibold">${d.name}</div>
          <div class="text-gray-500">${d.studentId} • ${d.year}</div>
          <div class="text-xs text-gray-400">${d.timestamp}</div>
        `;

        list.appendChild(row);
      });
    });
}

/* ================= SCANNER ================= */

let scanLock = false;

async function onScan(decodedText) {

  if (scanLock) return;
  scanLock = true;
  setTimeout(() => scanLock = false, 2000);

  if (!activeEvent) {
    result.innerText = "❌ No active event";
    return;
  }

  const studentDoc = await db.collection("students").doc(decodedText).get();

  if (!studentDoc.exists || !studentDoc.data().active) {
    result.innerText = "❌ Invalid student";
    return;
  }

  const student = studentDoc.data();

  const ref = db.collection("attendance")
    .doc(activeEvent)
    .collection("records");

  const dup = await ref.where("studentId", "==", decodedText).get();

  if (!dup.empty) {
    result.innerText = "⚠ Already scanned";
    return;
  }

  await ref.add({
    studentId: decodedText,
    name: student.name,
    year: student.year,
    timestamp: new Date().toISOString(),
    scannedBy: auth.currentUser.email
  });

  result.innerText = "✔ " + student.name;

  count++;
  countEl.innerText = count;

  fetch("https://script.google.com/macros/s/AKfycbwWnhp4kVnc_StNi_J6D71Llc5ui63LNyB37AyPXn2vWGL2aNdavqMH17JFX_MsvaY/exec", {
    method: "POST",
    body: JSON.stringify({
      eventId: activeEvent,
      studentId: decodedText,
      name: student.name,
      year: student.year,
      timestamp: new Date().toISOString(),
      scannedBy: auth.currentUser.email
    })
  });
}

/* ================= SCANNER START ================= */

async function startScanner() {

  if (html5QrCode) {
    try {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } catch (e) {}
  }

  html5QrCode = new Html5Qrcode("reader");

  const devices = await Html5Qrcode.getCameras();

  if (!devices.length) {
    alert("No camera found");
    return;
  }

  await html5QrCode.start(
    devices[0].id,
    { fps: 10, qrbox: 250 },
    onScan
  );
}

/* ================= AUTH ================= */

auth.onAuthStateChanged(async user => {

  if (user) {
    loginPage.classList.add("hidden");
    app.classList.remove("hidden");

    await loadUserRole(user);
    await loadActiveEvent();
    await loadEvents();

    startScanner();
  }
});

  window.login = login;
window.logout = logout;
window.createNewEvent = createNewEvent;
window.startScanner = startScanner;
window.endEvent = endEvent;
window.setActiveEvent = setActiveEvent;

</script>
