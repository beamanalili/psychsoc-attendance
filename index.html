<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Psychology Society Attendance System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

<!-- LOGIN -->
<div id="loginPage" class="w-full max-w-md mt-20 bg-gray-800 p-6 rounded-xl">
  <h1 class="text-xl font-bold text-center mb-4">Officer Login</h1>

  <input id="email" type="email" placeholder="Email"
    class="w-full p-2 mb-2 rounded bg-gray-700"/>

  <input id="password" type="password" placeholder="Password"
    class="w-full p-2 mb-4 rounded bg-gray-700"/>

  <button onclick="login()" class="w-full bg-blue-500 p-2 rounded">
    Login
  </button>

  <p id="loginError" class="text-red-400 text-sm mt-2"></p>
</div>

<!-- APP -->
<div id="app" class="hidden w-full max-w-md">

  <h1 class="text-2xl font-bold text-center mt-4">PsychSoc Attendance</h1>

  <div class="text-center">
    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded mt-2 text-sm">
      Logout
    </button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="mt-4 bg-gray-800 p-4 rounded-xl hidden">

    <h2 class="font-bold mb-2">Admin Controls</h2>

    <input id="eventName" placeholder="New event name"
      class="w-full p-2 rounded bg-gray-700 mb-2"/>

    <button onclick="createEvent()" class="bg-green-500 w-full p-2 rounded mb-2">
      Create Event
    </button>

    <button onclick="startEvent()" class="bg-blue-500 w-full p-2 rounded mb-2">
      Start Latest Event
    </button>

    <button onclick="endEvent()" class="bg-red-500 w-full p-2 rounded">
      End Event
    </button>

    <p id="activeEventText" class="text-sm mt-2 text-gray-300">
      No active event
    </p>
  </div>

  <!-- SCANNER -->
  <div class="mt-4 bg-white p-3 rounded-xl">
    <div id="reader"></div>
  </div>

  <div class="mt-4 bg-gray-800 p-3 rounded-xl">
    <p class="text-gray-400 text-sm">Last Scan</p>
    <p id="result">Waiting...</p>
  </div>

  <div class="mt-4 bg-gray-800 p-3 rounded-xl text-center">
    <p class="text-gray-400 text-sm">Count</p>
    <p id="count">0</p>
  </div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBTEYT5qUaVJMP3ZamaX7pRov51Dix_74w",
  authDomain: "psychsoc-attendance-system.firebaseapp.com",
  projectId: "psychsoc-attendance-system",
  storageBucket: "psychsoc-attendance-system.firebasestorage.app",
  messagingSenderId: "93131590758",
  appId: "1:93131590758:web:bfea89644381b1972af1a7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ================= DOM ================= */
const loginPage = document.getElementById("loginPage");
const app = document.getElementById("app");
const adminPanel = document.getElementById("adminPanel");

const eventName = document.getElementById("eventName");
const activeEventText = document.getElementById("activeEventText");

const result = document.getElementById("result");
const countEl = document.getElementById("count");

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginError = document.getElementById("loginError");

/* ================= STATE ================= */
let html5QrCode = null;
let userRole = null;
let activeEvent = null;
let count = 0;

/* ================= LOGIN ================= */

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(err => loginError.innerText = err.message);
}

/* ================= FIXED LOGOUT (SAFE) ================= */

function logout() {
  try {
    if (html5QrCode) {
      html5QrCode.stop().catch(()=>{});
      html5QrCode.clear();
      html5QrCode = null;
    }
  } catch (e) {}

  result.innerText = "Waiting...";
  count = 0;
  countEl.innerText = "0";
  activeEvent = null;

  auth.signOut();
}

/* ================= ROLE ================= */

async function loadUserRole(user) {
  const doc = await db.collection("users").doc(user.uid).get();

  if (doc.exists) {
    userRole = doc.data().role;
  }

  adminPanel.classList.toggle("hidden", userRole !== "admin");
}

/* ================= EVENTS ================= */

async function createEvent() {
  if (userRole !== "admin") return;

  await db.collection("events").add({
    name: eventName.value,
    active: false,
    createdBy: auth.currentUser.email,
    createdAt: new Date()
  });

  alert("Event created");
}

async function startEvent() {
  if (userRole !== "admin") return;

  const snap = await db.collection("events")
    .orderBy("createdAt", "desc")
    .limit(1)
    .get();

  if (snap.empty) return;

  const event = snap.docs[0];

  const all = await db.collection("events").get();
  all.forEach(d => db.collection("events").doc(d.id).update({ active: false }));

  await db.collection("events").doc(event.id).update({ active: true });

  activeEvent = event.id;
  activeEventText.innerText = "Active: " + event.data().name;
}

async function endEvent() {
  if (userRole !== "admin") return;

  const snap = await db.collection("events")
    .where("active", "==", true)
    .get();

  snap.forEach(d => db.collection("events").doc(d.id).update({ active: false }));

  activeEvent = null;
  activeEventText.innerText = "No active event";
}

/* ================= ACTIVE EVENT ================= */

async function loadActiveEvent() {
  const snap = await db.collection("events")
    .where("active", "==", true)
    .limit(1)
    .get();

  if (snap.empty) return;

  const doc = snap.docs[0];
  activeEvent = doc.id;
  activeEventText.innerText = "Active: " + doc.data().name;
}

/* ================= SCANNER ================= */

function startScanner() {

  if (html5QrCode) {
    html5QrCode.stop().catch(()=>{});
    html5QrCode.clear();
  }

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    if (!devices.length) return;

    html5QrCode.start(
      devices[0].id,
      { fps: 10, qrbox: 250 },
      onScan
    );
  });
}

/* ================= SCAN ================= */

async function onScan(decodedText) {

  if (!activeEvent) {
    result.innerText = "❌ No active event";
    return;
  }

  const studentDoc = await db.collection("students").doc(decodedText).get();

  if (!studentDoc.exists || !studentDoc.data().active) {
    result.innerText = "❌ Invalid student";
    return;
  }

  const student = studentDoc.data();

  const dup = await db.collection("attendance")
    .where("studentId", "==", decodedText)
    .where("eventId", "==", activeEvent)
    .get();

  if (!dup.empty) {
    result.innerText = "⚠ Already scanned";
    return;
  }

  const record = {
    studentId: decodedText,
    name: student.name,
    eventId: activeEvent,
    timestamp: new Date().toISOString(),
    scannedBy: auth.currentUser.email
  };

  await db.collection("attendance").add(record);

  fetch("YOUR_GOOGLE_SCRIPT_URL", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(record)
  });

  result.innerText = "✔ " + student.name;

  count++;
  countEl.innerText = count;
}

/* ================= AUTH STATE ================= */

auth.onAuthStateChanged(async user => {
  if (user) {
    loginPage.classList.add("hidden");
    app.classList.remove("hidden");

    await loadUserRole(user);
    await loadActiveEvent();

    startScanner();

  } else {
    loginPage.classList.remove("hidden");
    app.classList.add("hidden");
  }
});

</script>

</body>
</html>
