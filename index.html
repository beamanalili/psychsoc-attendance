<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBTEYT5qUaVjMP3ZamaX7pRov51Dix_74w",
  authDomain: "psychsoc-attendance-system.firebaseapp.com",
  projectId: "psychsoc-attendance-system",
  storageBucket: "psychsoc-attendance-system.firebasestorage.app",
  messagingSenderId: "93131590758",
  appId: "1:93131590758:web:bfea89644381b1972af1a7",
  measurementId: "G-C5SH1EEQP2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ================= DOM ================= */
const loginPage = document.getElementById("loginPage");
const app = document.getElementById("app");
const adminPanel = document.getElementById("adminPanel");

const eventName = document.getElementById("eventName");
const activeEventText = document.getElementById("activeEventText");

const result = document.getElementById("result");
const countEl = document.getElementById("count");

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginError = document.getElementById("loginError");

/* ================= STATE ================= */
let html5QrCode = null;
let userRole = null;
let activeEvent = null;
let count = 0;
let attendanceUnsubscribe = null; // Track the real-time listener

/* ================= UTILITY FUNCTIONS ================= */

// Format timestamp for display
function formatTimestamp(isoString) {
  try {
    const date = new Date(isoString);
    return date.toLocaleString('en-US', {
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    return isoString;
  }
}

// Safe async wrapper with error handling
async function safeAsync(fn, errorMessage = "An error occurred") {
  try {
    return await fn();
  } catch (error) {
    console.error(errorMessage, error);
    alert(errorMessage + ": " + error.message);
    return null;
  }
}

/* ================= LOGIN ================= */
async function login() {
  loginError.innerText = "";
  
  if (!email.value || !password.value) {
    loginError.innerText = "Please enter both email and password";
    return;
  }

  try {
    await auth.signInWithEmailAndPassword(email.value, password.value);
  } catch (err) {
    loginError.innerText = err.message;
  }
}

/* ================= LOGOUT ================= */
async function logout() {
  try {
    // Stop scanner first
    await stopScanner();
    
    // Unsubscribe from real-time listener
    if (attendanceUnsubscribe) {
      attendanceUnsubscribe();
      attendanceUnsubscribe = null;
    }
    
    // Reset UI
    result.innerText = "Waiting...";
    count = 0;
    countEl.innerText = "0";
    activeEvent = null;
    
    // Sign out
    await auth.signOut();
  } catch (error) {
    console.error("Logout error:", error);
  }
}

/* ================= SCANNER MANAGEMENT ================= */

async function stopScanner() {
  if (html5QrCode) {
    try {
      await html5QrCode.stop();
      html5QrCode.clear();
    } catch (e) {
      console.warn("Scanner stop error:", e);
    }
    html5QrCode = null;
  }
}

async function startScanner() {
  // Stop existing scanner if any
  await stopScanner();

  try {
    html5QrCode = new Html5Qrcode("reader");
    
    const devices = await Html5Qrcode.getCameras();
    
    if (!devices || devices.length === 0) {
      result.innerText = "❌ No camera found";
      return;
    }

    // Use back camera if available, otherwise first camera
    const backCamera = devices.find(device => 
      device.label.toLowerCase().includes('back') || 
      device.label.toLowerCase().includes('rear')
    );
    
    const cameraId = backCamera ? backCamera.id : devices[0].id;

    await html5QrCode.start(
      cameraId,
      { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      },
      onScan,
      (errorMessage) => {
        // Optional: handle parse errors
        console.debug("QR parse error:", errorMessage);
      }
    );
    
    result.innerText = "📷 Scanner ready - Scan student ID";
  } catch (error) {
    console.error("Scanner start error:", error);
    result.innerText = "❌ Camera error: " + error.message;
  }
}

/* ================= ROLE ================= */
async function loadUserRole(user) {
  try {
    const doc = await db.collection("users").doc(user.uid).get();

    if (doc.exists) {
      userRole = doc.data().role;
    } else {
      userRole = "user"; // Default role
    }

    if (adminPanel) {
      adminPanel.classList.toggle("hidden", userRole !== "admin");
    }
  } catch (error) {
    console.error("Error loading user role:", error);
    userRole = "user";
  }
}

/* ================= EVENTS ================= */

async function loadEvents() {
  try {
    const snap = await db.collection("events")
      .orderBy("createdAt", "desc")
      .get();

    const list = document.getElementById("eventList");
    if (!list) return;

    list.innerHTML = "";

    if (snap.empty) {
      list.innerHTML = "<p class='text-gray-500'>No events created yet</p>";
      return;
    }

    snap.forEach(doc => {
      const data = doc.data();

      const btn = document.createElement("button");
      btn.innerText = (data.active ? "🟢 " : "⚪ ") + data.name;
      btn.className = "w-full p-2 border rounded mb-2 text-left hover:bg-gray-50 transition";
      
      // Disable button if not admin
      if (userRole !== "admin") {
        btn.disabled = true;
        btn.classList.add("opacity-50", "cursor-not-allowed");
      }

      btn.onclick = () => {
        if (userRole === "admin") {
          setActiveEvent(doc.id);
        }
      };

      list.appendChild(btn);
    });
  } catch (error) {
    console.error("Error loading events:", error);
  }
}

async function loadActiveEvent() {
  try {
    const snap = await db.collection("events")
      .where("active", "==", true)
      .limit(1)
      .get();

    if (snap.empty) {
      activeEvent = null;
      if (activeEventText) activeEventText.innerText = "No active event";
      return;
    }

    const doc = snap.docs[0];
    activeEvent = doc.id;

    if (activeEventText) {
      activeEventText.innerText = "Active: " + doc.data().name;
    }

    // Start listening to attendance for this event
    listenToAttendance();
  } catch (error) {
    console.error("Error loading active event:", error);
  }
}

async function createNewEvent() {
  if (userRole !== "admin") {
    alert("Only admins can create events");
    return;
  }

  if (!eventName.value.trim()) {
    alert("Enter event name");
    return;
  }

  try {
    await db.collection("events").add({
      name: eventName.value.trim(),
      active: false,
      createdBy: auth.currentUser.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    eventName.value = "";
    await loadEvents();
    alert("Event created successfully!");
  } catch (error) {
    console.error("Error creating event:", error);
    alert("Failed to create event: " + error.message);
  }
}

async function setActiveEvent(eventId) {
  if (userRole !== "admin") {
    alert("Only admins can set active events");
    return;
  }

  try {
    // Get all events
    const all = await db.collection("events").get();

    // Use batch to deactivate all
    const batch = db.batch();
    all.forEach(doc => {
      batch.update(doc.ref, { active: false });
    });

    // Activate selected event
    batch.update(db.collection("events").doc(eventId), { active: true });

    await batch.commit();

    await loadActiveEvent();
    await loadEvents();
    
    alert("Event activated successfully!");
  } catch (error) {
    console.error("Error setting active event:", error);
    alert("Failed to activate event: " + error.message);
  }
}

async function endEvent() {
  if (userRole !== "admin") {
    alert("Only admins can end events");
    return;
  }

  try {
    const snap = await db.collection("events")
      .where("active", "==", true)
      .get();

    if (snap.empty) {
      alert("No active event to end");
      return;
    }

    const batch = db.batch();
    snap.forEach(doc => {
      batch.update(doc.ref, { active: false });
    });

    await batch.commit();

    activeEvent = null;

    if (activeEventText) {
      activeEventText.innerText = "No active event";
    }

    // Unsubscribe from attendance listener
    if (attendanceUnsubscribe) {
      attendanceUnsubscribe();
      attendanceUnsubscribe = null;
    }

    alert("Event ended successfully!");
  } catch (error) {
    console.error("Error ending event:", error);
    alert("Failed to end event: " + error.message);
  }
}

/* ================= LIVE DASHBOARD ================= */

function listenToAttendance() {
  // Unsubscribe from previous listener if exists
  if (attendanceUnsubscribe) {
    attendanceUnsubscribe();
  }

  if (!activeEvent) return;

  try {
    attendanceUnsubscribe = db.collection("attendance")
      .doc(activeEvent)
      .collection("records")
      .orderBy("timestamp", "desc")
      .onSnapshot(snapshot => {
        const list = document.getElementById("attendanceList");
        if (!list) return;

        list.innerHTML = "";

        if (snapshot.empty) {
          list.innerHTML = "<p class='text-gray-500 text-sm'>No attendees yet</p>";
          return;
        }

        snapshot.forEach(doc => {
          const d = doc.data();

          const row = document.createElement("div");
          row.className = "p-2 border rounded text-sm mb-1";

          row.innerHTML = `
            <div class="font-semibold">${d.name || 'Unknown'}</div>
            <div class="text-gray-500">${d.studentId || 'N/A'} • ${d.year || 'N/A'}</div>
            <div class="text-xs text-gray-400">${formatTimestamp(d.timestamp)}</div>
          `;

          list.appendChild(row);
        });
        
        // Update count based on actual records
        count = snapshot.size;
        countEl.innerText = count;
      }, error => {
        console.error("Attendance listener error:", error);
      });
  } catch (error) {
    console.error("Error setting up attendance listener:", error);
  }
}

/* ================= SCANNER ================= */

let scanLock = false;

async function onScan(decodedText) {
  if (scanLock) return;
  scanLock = true;
  
  // Visual feedback
  result.innerText = "⏳ Processing...";
  
  setTimeout(() => {
    scanLock = false;
  }, 2000);

  if (!activeEvent) {
    result.innerText = "❌ No active event";
    return;
  }

  try {
    // Check if student exists and is active
    const studentDoc = await db.collection("students").doc(decodedText).get();

    if (!studentDoc.exists) {
      result.innerText = "❌ Student not found";
      return;
    }

    const studentData = studentDoc.data();
    
    if (!studentData.active) {
      result.innerText = "❌ Student account inactive";
      return;
    }

    const student = studentData;

    // Check for duplicate attendance
    const ref = db.collection("attendance")
      .doc(activeEvent)
      .collection("records");

    const dup = await ref.where("studentId", "==", decodedText).get();

    if (!dup.empty) {
      result.innerText = "⚠️ Already scanned";
      return;
    }

    // Record attendance
    const timestamp = new Date().toISOString();
    const currentUserEmail = auth.currentUser?.email || "unknown";

    await ref.add({
      studentId: decodedText,
      name: student.name,
      year: student.year,
      timestamp: timestamp,
      scannedBy: currentUserEmail
    });

    result.innerText = "✔️ " + student.name;

    // Send to Google Sheets backup
    sendToGoogleSheets({
      eventId: activeEvent,
      studentId: decodedText,
      name: student.name,
      year: student.year,
      timestamp: timestamp,
      scannedBy: currentUserEmail
    });

  } catch (error) {
    console.error("Scan error:", error);
    result.innerText = "❌ Error: " + error.message;
  }
}

// Separate function for Google Sheets sync with better error handling
async function sendToGoogleSheets(data) {
  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbwWnhp4kVnc_StNi_J6D71Llc5ui63LNyB37AyPXn2vWGL2aNdavqMH17JFX_MsvaY/exec", {
      method: "POST",
      mode: "no-cors", // Required for Google Apps Script
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(data)
    });
    
    console.log("Synced to Google Sheets");
  } catch (error) {
    console.error("Google Sheets sync failed:", error);
    // Don't show alert to avoid disrupting UX
  }
}

/* ================= AUTH STATE LISTENER ================= */

auth.onAuthStateChanged(async user => {
  if (user) {
    loginPage.classList.add("hidden");
    app.classList.remove("hidden");

    await loadUserRole(user);
    await loadActiveEvent();
    await loadEvents();

    // Start scanner after a brief delay to ensure DOM is ready
    setTimeout(() => {
      startScanner();
    }, 500);
  } else {
    // User is signed out
    loginPage.classList.remove("hidden");
    app.classList.add("hidden");
    
    // Clean up
    await stopScanner();
    if (attendanceUnsubscribe) {
      attendanceUnsubscribe();
      attendanceUnsubscribe = null;
    }
  }
});

/* ================= WINDOW EXPORTS ================= */
window.login = login;
window.logout = logout;
window.createNewEvent = createNewEvent;
window.startScanner = startScanner;
window.endEvent = endEvent;
window.setActiveEvent = setActiveEvent;

</script>
